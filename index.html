<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://unpkg.com/html5-qrcode"></script><title>IMS Inventory</title><style>body{font-family:Inter,ui-sans-serif,system-ui;background:#f4f6fa}.navbtn.active{background:#e9efff;color:#2849b8;font-weight:700}.card{background:white;border:1px solid #e7eaf0;border-radius:16px;box-shadow:0 2px 12px #14203b08}.field{width:100%;border:1px solid #d8deea;border-radius:9px;padding:10px 12px;background:white}.btn{border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:#3158d5;color:white}.muted{background:#edf0f6;color:#334155}.danger{background:#fee2e2;color:#b91c1c}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #eef0f4;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:#667085}#loading{display:none;position:fixed;inset:0;background:#ffffffb8;z-index:40;align-items:center;justify-content:center}#login{min-height:100vh}main{min-width:0} .tablewrap{overflow:auto}label{font-size:13px;font-weight:600;color:#475467}</style></head><body><div id="loading"><div class="bg-white p-5 rounded-xl shadow font-semibold">Processing…</div></div><section id="login" class="flex items-center justify-center p-5"><div class="card w-full max-w-md p-7"><div class="text-xs font-bold tracking-widest text-blue-700">IMS · INVENTORY MANAGEMENT</div><h1 class="text-3xl font-bold mt-3">Welcome back</h1><p class="text-slate-500 mt-2 mb-6">Sign in to manage parts and service stock.</p><form id="loginForm" class="space-y-4"><div><label>Username</label><input id="username" class="field mt-1" required autocomplete="username"></div><div><label>Password</label><input id="password" type="password" class="field mt-1" required autocomplete="current-password"></div><button class="btn primary w-full">Sign in</button></form></div></section><div id="app" class="hidden min-h-screen"><header class="bg-white border-b px-4 md:px-7 py-4 flex justify-between items-center"><div><b class="text-blue-800">IMS</b><span class="text-slate-500 ml-2 hidden sm:inline">Spare Parts & Service</span></div><div class="flex items-center gap-3"><div id="who" class="text-right text-xs"></div><button id="logout" class="btn muted text-sm">Logout</button></div></header><div class="max-w-7xl mx-auto p-3 md:p-6"><nav class="flex gap-2 overflow-x-auto pb-4" id="nav"></nav><main id="view"></main></div></div><div id="scanner" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4"><div class="bg-white p-5 rounded-2xl w-full max-w-md"><div class="flex justify-between mb-3"><b>Scan barcode / QR</b><button class="btn muted" onclick="stopScan()">Close</button></div><div id="reader"></div></div></div>
<script>
let token=localStorage.getItem('ims_token'), user=null, data=null, chart=null, scanTarget=null;
const tabs=[['dashboard','Dashboard'],['inventory','Parts Inventory'],['stock','Stock In / Out'],['audit','Stock Audit'],['history','History & Export']];
function busy(on){document.getElementById('loading').style.display=on?'flex':'none'}
async function call(fn,...args){busy(true);try{const response=await fetch('/api/ims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:fn,args:[token,...args]})});const result=await response.json();if(!response.ok)throw new Error(result.error||'เรียกใช้เซิร์ฟเวอร์ไม่สำเร็จ');return result}catch(e){throw e}finally{busy(false)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function alertErr(e){Swal.fire({icon:'error',title:'Unable to complete',text:e.message||String(e)})}
async function start(){try{data=await call('getAppData');user=data.user;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').innerHTML=`<b>${esc(user.Full_Name)}</b><br>${esc(user.Branch)} · ${esc(user.Role)}`;renderNav();showTab('dashboard')}catch(e){localStorage.removeItem('ims_token');token=null;document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();busy(true);try{const response=await fetch('/api/ims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',args:[document.getElementById('username').value,document.getElementById('password').value]})});const result=await response.json();if(!response.ok)throw new Error(result.error||'เข้าสู่ระบบไม่สำเร็จ');token=result.token;localStorage.setItem('ims_token',token);await start()}catch(err){alertErr(err)}finally{busy(false)}};
document.getElementById('logout').onclick=async()=>{try{await call('logout')}catch(e){}localStorage.removeItem('ims_token');location.reload()};
function renderNav(){document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button class="navbtn px-4 py-2 rounded-lg whitespace-nowrap text-sm" data-tab="${id}" onclick="showTab('${id}')">${n}</button>`).join('')}
function showTab(id){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));({dashboard:dashboard,inventory:inventory,stock:stock,audit:audit,history:history})[id]()}
function refresh(){return call('getAppData').then(d=>{data=d;document.getElementById('who').innerHTML=`<b>${esc(d.user.Full_Name)}</b><br>${esc(d.user.Branch)} · ${esc(d.user.Role)}`})}
function panel(title,content,extra=''){document.getElementById('view').innerHTML=`<div class="flex justify-between items-center mb-4"><div><h1 class="text-2xl font-bold">${title}</h1><p class="text-sm text-slate-500 mt-1">Spare parts and service operations</p></div>${extra}</div>${content}`}
function dashboard(){const p=data.parts,good=p.filter(x=>x.Part_Condition==='Good').length,bad=p.length-good,low=p.filter(x=>+x.Current_Stock<=+x.Min_Stock);const value=user.Role==='Admin'?`<div class="card p-5"><div class="text-sm text-slate-500">Stock value</div><div class="text-2xl font-bold mt-2">${Number(data.totalValue||0).toLocaleString(undefined,{style:'currency',currency:'USD'})}</div></div>`:'';let daily={};data.transactions.filter(t=>t.Type==='OUT').forEach(t=>{let d=String(t.Timestamp||'').slice(0,10);daily[d]=(daily[d]||0)+Number(t.Qty)});panel('Dashboard',`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5"><div class="card p-5"><div class="text-sm text-slate-500">Part records</div><div class="text-2xl font-bold mt-2">${p.length}</div></div><div class="card p-5"><div class="text-sm text-slate-500">Good parts</div><div class="text-2xl font-bold mt-2">${good}</div></div><div class="card p-5"><div class="text-sm text-slate-500">Defective / claim</div><div class="text-2xl font-bold mt-2">${bad}</div></div><div class="card p-5"><div class="text-sm text-slate-500">At or below minimum</div><div class="text-2xl font-bold mt-2">${low.length}</div></div>${value}</div><div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><h2 class="font-bold mb-3">Daily repair issues</h2><canvas id="chart" height="140"></canvas></div><div class="card p-5"><h2 class="font-bold mb-3">Low stock alerts</h2>${table(['Part No.','Part name','Stock','Min','Bin'],low.map(x=>[x.Part_No,x.Part_Name,x.Current_Stock,x.Min_Stock,x.Bin_Location]))}</div></div>`,user.Role==='Admin'?'<button class="btn muted" onclick="manageUsers()">Manage users</button>':'');const labels=Object.keys(daily).sort();chart?.destroy();chart=new Chart(document.getElementById('chart'),{type:'bar',data:{labels,datasets:[{label:'Qty issued',data:labels.map(x=>daily[x]),backgroundColor:'#4567dc',borderRadius:5}]},options:{responsive:true,plugins:{legend:{display:false}}}})}
async function manageUsers(){
  try{
    const users=await call('getUsers');
    const result=await Swal.fire({title:'User management',html:`<div class="text-left max-h-52 overflow-auto">${users.map(u=>`<div class="border-b py-2 flex justify-between gap-2"><span><b>${esc(u.Username)}</b> · ${esc(u.Full_Name)}<br><small>${esc(u.Role)} · ${esc(u.Branch)}</small></span>${u.Username!==user.Username?`<button type="button" class="text-red-600" data-delete-user="${esc(u.Username)}">Delete</button>`:''}</div>`).join('')}</div>`,showDenyButton:true,denyButtonText:'Add user',confirmButtonText:'Done',showCancelButton:true,cancelButtonText:'Close',didOpen:()=>document.querySelectorAll('[data-delete-user]').forEach(button=>button.addEventListener('click',()=>{window.deleteTarget=button.dataset.deleteUser;Swal.clickConfirm()}))});
    if(result.isDenied){
      const {value:v}=await Swal.fire({title:'Add user',html:'<input id="nu" class="swal2-input" placeholder="Username"><input id="np" type="password" class="swal2-input" placeholder="Password"><input id="nn" class="swal2-input" placeholder="Full name"><select id="nr" class="swal2-input"><option>Staff</option><option>Admin</option></select><input id="nb" class="swal2-input" placeholder="Branch">',showCancelButton:true,preConfirm:()=>({Username:document.getElementById('nu').value,Password:document.getElementById('np').value,Full_Name:document.getElementById('nn').value,Role:document.getElementById('nr').value,Branch:document.getElementById('nb').value})});
      if(v){await call('saveUser',v);Swal.fire('Created','User added.','success')}
    }else if(result.isConfirmed&&window.deleteTarget){const target=window.deleteTarget;window.deleteTarget=null;await call('deleteUser',target);Swal.fire('Deleted','User removed.','success')}
  }catch(e){alertErr(e)}
}
function table(head,rows){return `<div class="tablewrap"><table class="w-full text-sm"><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="text-slate-400">No records</td></tr>`}</tbody></table></div>`}
function inventory(){const admin=user.Role==='Admin';panel('Parts Inventory',`<div class="card p-4 mb-4"><div class="grid sm:grid-cols-3 gap-3"><input id="q" class="field" placeholder="Search part, name or model" oninput="filterParts()"><select id="filter" class="field" onchange="filterParts()"><option value="">All conditions</option><option>Good</option><option>Defective</option><option>Low Stock</option></select><div class="flex gap-2"><button class="btn muted" onclick="scan('q')">▣ Scan</button>${admin?'<button class="btn primary" onclick="partForm()">+ Add part</button>':''}</div></div></div><div class="card p-2" id="partsTable"></div>`);filterParts()}
function filterParts(){
  const box=document.getElementById('partsTable');
  if(!box)return;
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  const f=document.getElementById('filter')?.value||'';
  const parts=data.parts.filter(p=>[p.Part_No,p.Part_Name,p.Device_Model].join(' ').toLowerCase().includes(q)&&(!f||(f==='Low Stock'?+p.Current_Stock<=+p.Min_Stock:p.Part_Condition===f)));
  const admin=user.Role==='Admin';
  const heads=['Part No.','Part name','Device model','Type','Condition','Stock','Min','Bin',...(admin?['Unit cost','Actions']:[])];
  const body=parts.map(p=>{
    const values=[p.Part_No,p.Part_Name,p.Device_Model,p.Part_Type,p.Part_Condition,p.Current_Stock,p.Min_Stock,p.Bin_Location,...(admin?[p.Unit_Cost]:[])];
    const cells=values.map(value=>`<td>${esc(value)}</td>`).join('');
    const actions=admin?`<td><button type="button" class="text-blue-700" data-edit-part="${esc(p.Part_No)}">Edit</button> <button type="button" class="text-red-600" data-delete-part="${esc(p.Part_No)}">Delete</button></td>`:'';
    return `<tr>${cells}${actions}</tr>`;
  }).join('');
  box.innerHTML=`<div class="tablewrap"><table class="w-full text-sm"><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${heads.length}" class="p-4 text-slate-400">No matching parts</td></tr>`}</tbody></table></div>`;
  box.querySelectorAll('[data-edit-part]').forEach(button=>button.addEventListener('click',()=>editPart(button.dataset.editPart)));
  box.querySelectorAll('[data-delete-part]').forEach(button=>button.addEventListener('click',()=>delPart(button.dataset.deletePart)));
}
async function partForm(){const {value:v}=await Swal.fire({title:'Add part',html:`<input id="pno" class="swal2-input" placeholder="Part number *"><input id="pname" class="swal2-input" placeholder="Part name *"><input id="model" class="swal2-input" placeholder="Device model"><input id="ptype" class="swal2-input" placeholder="Type (Screen, Battery…)"><select id="cond" class="swal2-input"><option>Good</option><option>Defective</option></select><input id="cost" type="number" min="0" class="swal2-input" placeholder="Unit cost"><input id="qty" type="number" min="0" class="swal2-input" placeholder="Current stock"><input id="min" type="number" min="0" class="swal2-input" placeholder="Minimum stock"><input id="bin" class="swal2-input" placeholder="Bin location">`,focusConfirm:false,showCancelButton:true,preConfirm:()=>({Part_No:document.getElementById('pno').value,Part_Name:document.getElementById('pname').value,Device_Model:document.getElementById('model').value,Part_Type:document.getElementById('ptype').value,Part_Condition:document.getElementById('cond').value,Unit_Cost:document.getElementById('cost').value||0,Current_Stock:document.getElementById('qty').value||0,Min_Stock:document.getElementById('min').value||0,Bin_Location:document.getElementById('bin').value})});if(!v)return;try{await call('savePart',v);await refresh();inventory()}catch(e){alertErr(e)}}
async function editPart(no){const p=data.parts.find(x=>String(x.Part_No)===String(no));if(!p)return;const {value:v}=await Swal.fire({title:"Edit part",html:`<input id="epno" class="swal2-input" placeholder="Part number" value="${esc(p.Part_No)}"><input id="epname" class="swal2-input" placeholder="Part name" value="${esc(p.Part_Name)}"><input id="epmodel" class="swal2-input" placeholder="Device model" value="${esc(p.Device_Model)}"><input id="eptype" class="swal2-input" placeholder="Part type" value="${esc(p.Part_Type)}"><select id="epcond" class="swal2-input"><option ${p.Part_Condition==="Good"?"selected":""}>Good</option><option ${p.Part_Condition==="Defective"?"selected":""}>Defective</option></select><input id="epcost" type="number" min="0" class="swal2-input" placeholder="Unit cost" value="${esc(p.Unit_Cost)}"><input id="epqty" type="number" min="0" class="swal2-input" placeholder="Current stock" value="${esc(p.Current_Stock)}"><input id="epmin" type="number" min="0" class="swal2-input" placeholder="Minimum stock" value="${esc(p.Min_Stock)}"><input id="epbin" class="swal2-input" placeholder="Bin location" value="${esc(p.Bin_Location)}">`,showCancelButton:true,preConfirm:()=>({Part_No:document.getElementById("epno").value,Part_Name:document.getElementById("epname").value,Device_Model:document.getElementById("epmodel").value,Part_Type:document.getElementById("eptype").value,Part_Condition:document.getElementById("epcond").value,Unit_Cost:document.getElementById("epcost").value,Current_Stock:document.getElementById("epqty").value,Min_Stock:document.getElementById("epmin").value,Bin_Location:document.getElementById("epbin").value})});if(!v)return;try{await call("updatePart",no,v);await refresh();inventory()}catch(e){alertErr(e)}}
async function delPart(no){const r=await Swal.fire({title:'Delete part?',text:no,icon:'warning',showCancelButton:true,confirmButtonText:'Delete'});if(!r.isConfirmed)return;try{await call('deletePart',no);await refresh();inventory()}catch(e){alertErr(e)}}
function stock(){panel('Stock In / Out',`<div class="card p-5 max-w-2xl"><form id="txform" class="grid sm:grid-cols-2 gap-4"><div><label>Transaction type</label><select id="txType" class="field mt-1" onchange="jobRequired()"><option value="IN">Stock in</option><option value="OUT">Issue for repair</option><option value="RETURN">Return defective part</option></select></div><div><label>Part</label><div class="flex gap-2 mt-1"><select id="partNo" class="field" required>${data.parts.map(p=>`<option value="${esc(p.Part_No)}">${esc(p.Part_No)} — ${esc(p.Part_Name)} (${p.Current_Stock})</option>`).join('')}</select><button type="button" class="btn muted" onclick="scan('partNo')">▣</button></div></div><div><label>Quantity</label><input id="qty" type="number" min="1" step="1" class="field mt-1" required></div><div><label>Job order / reference</label><div class="flex gap-2 mt-1"><input id="job" class="field"><button type="button" class="btn muted" onclick="scan('job')">▣</button></div></div><div class="sm:col-span-2"><label>Note</label><input id="note" class="field mt-1"></div><button class="btn primary sm:col-span-2">Save transaction</button></form></div>`);jobRequired();document.getElementById('txform').onsubmit=async e=>{e.preventDefault();try{await call('transact',{Type:document.getElementById('txType').value,Part_No:document.getElementById('partNo').value,Qty:document.getElementById('qty').value,Job_Order_No:document.getElementById('job').value,Note:document.getElementById('note').value});await refresh();Swal.fire('Saved','Stock transaction recorded.','success');stock()}catch(e){alertErr(e)}}}
function jobRequired(){const t=document.getElementById('txType'),j=document.getElementById('job');if(t&&j)j.required=t.value==='OUT'}
function audit(){panel('Stock Audit',`<div class="card p-4 mb-4"><div class="flex gap-2"><input id="auditSearch" class="field" placeholder="Search part number / name" oninput="filterAudit()"><button class="btn muted" onclick="scan('auditSearch')">▣ Scan</button></div></div><div class="card p-2" id="auditTable"></div><div class="card p-4 mt-4"><h2 class="font-bold mb-2">Recent audit records</h2>${table(['Date','Part No.','Part name','System','Actual','Variance','Status','Auditor'],data.audits.map(a=>[a.Date,a.Part_No,a.Part_Name,a.System_Stock,a.Actual_Count,a.Variance,a.Status,a.Auditor]))}</div>`);filterAudit()}
function filterAudit(){
  const box=document.getElementById('auditTable');
  if(!box)return;
  const q=(document.getElementById('auditSearch')?.value||'').toLowerCase();
  const parts=data.parts.filter(p=>(p.Part_No+' '+p.Part_Name).toLowerCase().includes(q));
  const body=parts.map((p,i)=>`<tr><td>${esc(p.Part_No)}</td><td>${esc(p.Part_Name)}</td><td>${esc(p.Current_Stock)}</td><td><input id="actual${i}" type="number" min="0" step="1" class="field w-24" value="${esc(p.Current_Stock)}" data-variance-index="${i}" data-system-stock="${Number(p.Current_Stock)||0}"></td><td id="var${i}">0</td><td><button type="button" class="btn muted" data-save-count="${esc(p.Part_No)}" data-count-input="actual${i}">Save count</button>${user.Role==='Admin'?` <button type="button" class="btn primary" data-adjust-count="${esc(p.Part_No)}" data-count-input="actual${i}">Adjust stock</button>`:''}</td></tr>`).join('');
  box.innerHTML=`<div class="tablewrap"><table class="w-full text-sm"><thead><tr><th>Part No.</th><th>Part name</th><th>System stock</th><th>Actual count</th><th>Variance</th><th>Action</th></tr></thead><tbody>${body||'<tr><td colspan="6" class="p-4 text-slate-400">No matching parts</td></tr>'}</tbody></table></div>`;
  box.querySelectorAll('[data-variance-index]').forEach(input=>input.addEventListener('input',()=>variance(Number(input.dataset.varianceIndex),Number(input.dataset.systemStock))));
  box.querySelectorAll('[data-save-count]').forEach(button=>button.addEventListener('click',()=>saveCount(button.dataset.saveCount,button.dataset.countInput)));
  box.querySelectorAll('[data-adjust-count]').forEach(button=>button.addEventListener('click',()=>adjust(button.dataset.adjustCount,button.dataset.countInput)));
}
function variance(i,s){const a=Number(document.getElementById('actual'+i).value)||0;document.getElementById('var'+i).textContent=a-s}
async function saveCount(no,id){try{const r=await call('saveAudit',{Part_No:no,Actual_Count:document.getElementById(id).value});await refresh();Swal.fire('Audit saved',`Variance: ${r.variance}`,'success');audit()}catch(e){alertErr(e)}}
async function adjust(no,id){const actual=document.getElementById(id).value;const r=await Swal.fire({title:'Adjust system stock?',text:`Set ${no} stock to ${actual}?`,input:'text',inputLabel:'Adjustment note',showCancelButton:true});if(!r.isConfirmed)return;try{await call('adjustStock',no,actual,r.value);await refresh();audit()}catch(e){alertErr(e)}}
function history(){const tx=data.transactions;panel('History & Export',`<div class="card p-4 mb-4 grid sm:grid-cols-3 gap-3"><input id="histQ" class="field" placeholder="Filter job order" oninput="filterHistory()"><input id="histDate" type="date" class="field" onchange="filterHistory()"><button class="btn primary" onclick="exportCsv()">Export CSV</button></div><div id="historyTable" class="card p-2"></div>`);filterHistory()}
function filterHistory(){const box=document.getElementById('historyTable');if(!box)return;let q=(document.getElementById('histQ')?.value||'').toLowerCase(),d=document.getElementById('histDate')?.value||'';let xs=data.transactions.filter(t=>String(t.Job_Order_No||'').toLowerCase().includes(q)&&(!d||String(t.Timestamp).startsWith(d)));box.innerHTML=table(['Date','Type','Part No.','Part name','Qty','Job order','User','Note'],xs.map(t=>[t.Timestamp,t.Type,t.Part_No,t.Part_Name,t.Qty,t.Job_Order_No,t.Technician_Or_User,t.Note]))}
async function exportCsv(){try{const rows=await call('getCsvData');if(!rows.length){Swal.fire('No data','There are no transactions to export.','info');return}const heads=Object.keys(rows[0]),csv=[heads,...rows.map(x=>heads.map(h=>x[h]))].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='ims-transactions.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){alertErr(e)}}
let scannerStarted=false,scannerStarting=false;
async function scan(target){if(scannerStarting||scannerStarted)return;scanTarget=target;const box=document.getElementById('scanner');box.classList.remove('hidden');box.classList.add('flex');scannerStarting=true;scannerStarted=false;try{if(window.qrScanner){try{await window.qrScanner.clear()}catch(_){}window.qrScanner=null}window.qrScanner=new Html5Qrcode('reader');await window.qrScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:180}},txt=>{const el=document.getElementById(scanTarget);if(el){el.value=txt;el.dispatchEvent(new Event('input'));el.dispatchEvent(new Event('change'));if(scanTarget==='q')filterParts();if(scanTarget==='auditSearch')filterAudit()}stopScan()},()=>{});scannerStarted=true}catch(e){const detail=String(e&&e.message||e);await Swal.fire({icon:'error',title:'Camera permission unavailable',text:detail.includes('NotAllowedError')||detail.toLowerCase().includes('permission')?'The current page or embedded frame is not allowed to use the camera. Open the deployed Web App directly in a browser tab, then allow camera access in the browser/site settings. You can still type or paste the barcode manually.':detail});await disposeScanner()}finally{scannerStarting=false}}
async function disposeScanner(){const scanner=window.qrScanner;window.qrScanner=null;if(scanner&&scannerStarted){try{await scanner.stop()}catch(e){console.warn('Scanner stop:',e)}}scannerStarted=false;if(scanner){try{scanner.clear()}catch(e){console.warn('Scanner clear:',e)}}const box=document.getElementById('scanner');box.classList.add('hidden');box.classList.remove('flex')}
function stopScan(){if(scannerStarting)return;return disposeScanner()}
if(token)start();
</script></body></html>
